[workspace]
members = [
  "dwctl",
  "fusillade",
  "fusillade-arsenal",
  "fusillade-core",
  "onwards",
]
default-members = ["dwctl"]
resolver = "2"

# Coverage builds compile the entire test suite as one very large crate. Full
# debug info and incremental state make that clean build slower and produce
# several gigabytes of artifacts, while neither is needed for CI coverage.
[profile.ci]
inherits = "test"
debug = 0
incremental = false

# Local development of the pool-router 0.3 change; replaced by the published
# version before merge.
[patch.crates-io]
sqlx-pool-router = { path = "/Users/peter/titan/sqlx-pool-router-worktrees/swappable-pools" }
