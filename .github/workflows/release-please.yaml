name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.release.outputs.prs }}
    steps:
      # A GitHub App installation token, not GITHUB_TOKEN: events created with
      # GITHUB_TOKEN don't start other workflows, and release PRs need CI and
      # published releases need release.yml.
      - name: Mint Release Please app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Only this repository (the default) and only what release-please
          # needs, whatever else the App installation may be granted.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  synchronize-release-prs:
    needs: [release-please]
    if: >-
      ${{
        needs.release-please.outputs.prs != '' &&
        needs.release-please.outputs.prs != '[]'
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.release-please.outputs.prs) }}
    steps:
      # Installation tokens last an hour and are per job, so mint another here;
      # the push below must also start CI on the release PR.
      - name: Mint Release Please app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Only this repository (the default) and only what release-please
          # needs, whatever else the App installation may be granted.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Checkout release PR
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ matrix.pr.headBranchName }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Synchronize release dependencies and lockfile
        run: |
          python3 .github/scripts/sync-fusillade-release-dependencies.py
          cargo metadata --format-version 1 > /dev/null

          if git diff --quiet -- Cargo.lock fusillade-arsenal/Cargo.toml; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock fusillade-arsenal/Cargo.toml
          git commit -m "chore: synchronize release dependencies"
          git push origin HEAD:${{ matrix.pr.headBranchName }}
